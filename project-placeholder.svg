<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#13171a"/>
      <stop offset="100%" style="stop-color:#0d0f11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e5383b"/>
      <stop offset="100%" style="stop-color:#ba181b"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid decorativa -->
  <g stroke="rgba(229,56,59,0.06)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>

  <!-- Círculo decorativo exterior -->
  <circle cx="400" cy="200" r="110" fill="none" stroke="rgba(229,56,59,0.12)" stroke-width="1" stroke-dasharray="6 4"/>
  <!-- Círculo decorativo interior -->
  <circle cx="400" cy="200" r="78" fill="rgba(229,56,59,0.05)" stroke="rgba(229,56,59,0.2)" stroke-width="1"/>

  <!-- Ícono monitor -->
  <rect x="358" y="162" width="84" height="56" rx="5" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <line x1="390" y1="218" x2="410" y2="218" stroke="url(#accent)" stroke-width="2.5"/>
  <line x1="400" y1="218" x2="400" y2="228" stroke="url(#accent)" stroke-width="2.5"/>
  <line x1="388" y1="228" x2="412" y2="228" stroke="url(#accent)" stroke-width="2.5"/>
  <!-- Líneas de código en el monitor -->
  <line x1="370" y1="178" x2="390" y2="178" stroke="rgba(229,56,59,0.6)" stroke-width="2" stroke-linecap="round"/>
  <line x1="370" y1="186" x2="428" y2="186" stroke="rgba(229,56,59,0.35)" stroke-width="2" stroke-linecap="round"/>
  <line x1="370" y1="194" x2="415" y2="194" stroke="rgba(229,56,59,0.35)" stroke-width="2" stroke-linecap="round"/>
  <line x1="370" y1="202" x2="405" y2="202" stroke="rgba(229,56,59,0.35)" stroke-width="2" stroke-linecap="round"/>

  <!-- Texto -->
  <text x="400" y="272" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="rgba(229,56,59,0.7)" text-anchor="middle" letter-spacing="3">SIN IMAGEN</text>

  <!-- Puntos de acento esquinas -->
  <circle cx="30" cy="30" r="3" fill="rgba(229,56,59,0.25)"/>
  <circle cx="770" cy="30" r="3" fill="rgba(229,56,59,0.25)"/>
  <circle cx="30" cy="420" r="3" fill="rgba(229,56,59,0.25)"/>
  <circle cx="770" cy="420" r="3" fill="rgba(229,56,59,0.25)"/>

  <!-- Líneas esquina superior izquierda -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="rgba(229,56,59,0.3)" stroke-width="1.5"/>
  <line x1="20" y1="20" x2="20" y2="60" stroke="rgba(229,56,59,0.3)" stroke-width="1.5"/>
  <!-- Líneas esquina superior derecha -->
  <line x1="780" y1="20" x2="740" y2="20" stroke="rgba(229,56,59,0.3)" stroke-width="1.5"/>
  <line x1="780" y1="20" x2="780" y2="60" stroke="rgba(229,56,59,0.3)" stroke-width="1.5"/>
  <!-- Líneas esquina inferior izquierda -->
  <line x1="20" y1="430" x2="60" y2="430" stroke="rgba(229,56,59,0.3)" stroke-width="1.5"/>
  <line x1="20" y1="430" x2="20" y2="390" stroke="rgba(229,56,59,0.3)" stroke-width="1.5"/>
  <!-- Líneas esquina inferior derecha -->
  <line x1="780" y1="430" x2="740" y2="430" stroke="rgba(229,56,59,0.3)" stroke-width="1.5"/>
  <line x1="780" y1="430" x2="780" y2="390" stroke="rgba(229,56,59,0.3)" stroke-width="1.5"/>
</svg>
